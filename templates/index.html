<!DOCTYPE html>
<html>

<head>
    <title>Concert Ticket Booking</title>
</head>

<body>

    <h1>Concert Ticket Booking System</h1>

    <form action="/book-ticket" method="POST">

        <label>Full Name:</label><br>
        <input type="text" name="full_name"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email"><br><br>

        <label>Phone:</label><br>
        <input type="text" name="phone"><br><br>

        <label>Date of Birth:</label><br>
        <input type="date" name="date_of_birth"><br><br>

        <label>IC Number:</label><br>
        <input type="text" name="ic_number"><br><br>

        <label>Payment Reference:</label><br>
        <input type="text" name="payment_reference"><br><br>

        <label>Seat Type:</label><br>

        <select name="seat_type">
            <option value="VIP">VIP</option>
            <option value="Standard">Standard</option>
            <option value="Standing">Standing</option>
        </select>

        <br><br>

        <label>Number of Pax:</label><br>

        <input type="number" name="number_of_pax" min="1" max="10">

        <br><br>

        <button type="submit">Book Ticket</button>

    </form>

</body>

</html>
